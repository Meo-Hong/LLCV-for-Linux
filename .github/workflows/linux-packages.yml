name: Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - "linux-v*"

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.image }} ${{ matrix.arch || 'amd64' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", arch: "" }
          - { image: "debian:12", arch: "arm64" }
          - { image: "debian:13", arch: "armhf" }
    steps:
      - uses: actions/checkout@v4
      - name: Build package in ${{ matrix.image }}
        run: linux/tools/build-deb-docker.sh "${{ matrix.image }}" ${{ matrix.arch }}
      - name: Name artifact
        id: name
        run: echo "value=deb-$(echo '${{ matrix.image }}' | tr ':.' '--')-${{ matrix.arch || 'amd64' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: linux/dist
          if-no-files-found: error

  deb-install:
    name: install check (${{ matrix.image }} ${{ matrix.arch }})
    needs: deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", arch: "amd64" }
          - { image: "ubuntu:24.04", arch: "amd64" }
          - { image: "ubuntu:26.04", arch: "amd64" }
          - { image: "debian:12", arch: "amd64" }
          - { image: "debian:13", arch: "amd64" }
          - { image: "debian:12", arch: "arm64" }
          - { image: "debian:13", arch: "arm64" }
          - { image: "debian:13", arch: "armhf" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'amd64'
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: linux/dist
          merge-multiple: true
      - name: Install and run in ${{ matrix.image }}
        run: |
          deb="$(ls linux/dist/*/llcv_*_${{ matrix.arch }}.deb | head -n 1)"
          linux/tools/test-deb-install.sh "${{ matrix.image }}" "${{ matrix.arch }}" "$deb"

  rpm:
    name: rpm (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["almalinux:9"]
    steps:
      - uses: actions/checkout@v4
      - name: Build package in ${{ matrix.image }}
        run: linux/tools/build-rpm-docker.sh "${{ matrix.image }}"
      - name: Name artifact
        id: name
        run: echo "value=rpm-$(echo '${{ matrix.image }}' | tr ':.' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: linux/dist
          if-no-files-found: error

  arch:
    name: Arch Linux package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel cmake pkgconf sdl3 libjpeg-turbo libpng wayland wayland-protocols libglvnd ffmpeg
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd linux/packaging/arch
          su builder -c "makepkg -f --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: linux/packaging/arch/*.pkg.tar.*
          if-no-files-found: error

  apt-repository:
    name: APT repository
    needs: [deb, deb-install]
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: linux/dist
          merge-multiple: true
      - name: Check signing secrets
        env:
          LLCV_APT_PRIVATE_KEY: ${{ secrets.LLCV_APT_PRIVATE_KEY }}
          LLCV_APT_KEY_ID: ${{ secrets.LLCV_APT_KEY_ID }}
        run: |
          if [ -z "$LLCV_APT_PRIVATE_KEY" ] || [ -z "$LLCV_APT_KEY_ID" ]; then
            echo "LLCV_APT_PRIVATE_KEY and LLCV_APT_KEY_ID secrets are required to publish." >&2
            exit 1
          fi
      - name: Import signing key
        env:
          LLCV_APT_PRIVATE_KEY: ${{ secrets.LLCV_APT_PRIVATE_KEY }}
        run: printf '%s\n' "$LLCV_APT_PRIVATE_KEY" | gpg --batch --import
      - name: Build signed repository
        env:
          LLCV_APT_SIGNING_KEY: ${{ secrets.LLCV_APT_KEY_ID }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils
          linux/tools/build-apt-repo.sh "$GITHUB_WORKSPACE/apt-repo"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apt-repo
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: GitHub release
    needs: [deb, deb-install, rpm, arch]
    if: startsWith(github.ref, 'refs/tags/linux-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: linux/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: linux/dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: linux/dist/arch
      - name: Collect release files
        run: sh linux/tools/collect-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="$(ls -d linux/dist/release/llcv-*)"
          version="${dir##*/llcv-}"
          cat > downloads.md <<EOF
          | 파일 / File | 설치할 OS / Install on |
          | --- | --- |
          | \`llcv_${version}_amd64.deb\` | Ubuntu 22.04~26.04, Debian 12·13, Linux Mint, Pop!_OS, Zorin OS, elementary OS, LMDE, Kali |
          | \`llcv_${version}_arm64.deb\` | Debian 12·13, Raspberry Pi OS 64-bit |
          | \`llcv_${version}_raspberrypi-32bit_armhf.deb\` | Raspberry Pi OS 32-bit (trixie) |
          | \`llcv-${version}-1.x86_64.rpm\` | Fedora, Nobara, RHEL, Rocky Linux, AlmaLinux 9·10 |
          | \`llcv-${version}-1-x86_64.pkg.tar.zst\` | Arch Linux, Manjaro, EndeavourOS |

          - \`.deb\`: \`sudo apt install ./<file>\`. 설치하면 APT 업데이트 저장소가 등록됩니다. / Installing registers the APT update repository.
          - \`.rpm\`: \`sudo dnf install ./<file>\`
          - Arch: \`sudo pacman -U ./<file>\`
          - \`SHA256SUMS\`: \`sha256sum -c SHA256SUMS --ignore-missing\`

          안내 / Guide: [linux/README.ko.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/linux/README.ko.md) · [linux/README.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/linux/README.md)
          EOF
          notes="linux/release-notes/v${version}.md"
          if [ -f "$notes" ]; then
            { cat "$notes"; printf '\n## 설치 파일 / Downloads\n\n'; cat downloads.md; } > release-notes.md
          else
            mv downloads.md release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$dir"/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$dir"/* --title "LLCV for Linux $version" --notes-file release-notes.md
          fi
